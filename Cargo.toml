[package]
name = "cadrs-adapter"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The cadrs adapter for the B-rep protocol the conformance suite drives"
publish = false

[dependencies]
# The protocol from a local checkout of the suite, for changes not yet on its main branch.
brep-protocol = { path = "../brep-conformance-add-cadrs/protocol" }
# cadrs_kernel is not on crates.io. Keep `VERSION` in src/cadrs.rs equal to this rev.
cadrs_kernel = { git = "https://github.com/rvdende/cadrs", rev = "bb09c367" }
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
